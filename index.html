<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sample App</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        color: #17324d;
        background: #f4efe6;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        max-width: 34rem;
        padding: 3rem;
        border: 1px solid #c9bda9;
        background: #fffdf8;
        box-shadow: 12px 12px 0 #d8c8b0;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.5rem, 10vw, 5rem);
        line-height: 0.95;
      }

      p {
        margin: 0;
        font-size: 1.15rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, sample app.</h1>
      <p>This tiny page is ready to open directly in a browser and serves as a starting point for the project.</p>
    </main>
  </body>
</html>
